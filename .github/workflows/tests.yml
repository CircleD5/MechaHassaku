name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same as the production VM
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
